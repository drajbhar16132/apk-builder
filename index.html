<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Runner</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#eef0f4;--muted:#9aa0ac;--accent:#6c8cff;--border:#2a2e38}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);min-height:100vh}
h1{font-size:20px;padding:14px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;font-weight:600}
button.on,button.go{background:var(--accent);border-color:var(--accent);color:#fff}
textarea,input[type=url]{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-family:ui-monospace,monospace}
textarea{height:45vh;resize:vertical}
.pane{display:none}.pane.on{display:block}
.file{display:block;text-align:center;border:2px dashed var(--border);border-radius:12px;padding:40px 12px;color:var(--muted)}
.file input{display:none}
#fname{margin-top:8px;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px;margin:8px 0}
.row{display:flex;gap:8px;margin-top:12px}
#full{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:10}
#full.on{display:flex}
#bar{background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;gap:8px}
#bar button{padding:8px}
#frame{flex:1;width:100%;border:0;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<h1>▶️ HTML Runner</h1>
<div class="tabs">
  <button class="on" data-t="code">Code</button>
  <button data-t="file">File</button>
  <button data-t="url">URL</button>
</div>

<div class="pane on" id="p-code">
  <textarea id="code" spellcheck="false" placeholder="Yahan HTML code paste karo..."></textarea>
</div>

<div class="pane" id="p-file">
  <button class="go" id="pick" type="button" style="width:100%">📁 Select File</button>
  <input type="file" id="file" style="width:100%;margin-top:10px;color:var(--muted)">
  <div class="note">Button na chale to upar wale "Choose file" se select karo. Koi bhi .html / .htm file chalegi.</div>
  <div id="fname"></div>
</div>

<div class="pane" id="p-url">
  <input type="url" id="url" placeholder="https://example.com">
  <div class="note">Note: kuch sites (Google, YouTube, Facebook) iframe me block hoti hain. Aisi site "New tab" se kholo.</div>
</div>

<div class="row">
  <button class="go" id="run">▶ Run</button>
  <button id="tab">New tab</button>
</div>

<div id="full">
  <div id="bar"><button id="close">✕ Close</button><button id="reload">↻ Reload</button></div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"></iframe>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'code', fileText = '';

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  mode = b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + mode));
});

$('pick').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  if(!f) return;
  fileText = await f.text();
  $('fname').textContent = '✅ ' + f.name + ' (' + Math.round(f.size/1024) + ' KB)';
};

function normUrl(u){
  u = u.trim();
  if(!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}
function getSource(){
  if(mode === 'code') return {html: $('code').value};
  if(mode === 'file') return {html: fileText};
  return {url: normUrl($('url').value)};
}

function run(){
  const s = getSource();
  if(s.url === '' || s.html === '' ){
    alert('Pehle code, file ya URL do.');
    return;
  }
  if(s.url){ $('frame').removeAttribute('srcdoc'); $('frame').src = s.url; }
  else { $('frame').removeAttribute('src'); $('frame').srcdoc = s.html; }
  $('full').classList.add('on');
}
$('run').onclick = run;
$('close').onclick = () => { $('full').classList.remove('on'); $('frame').removeAttribute('src'); $('frame').removeAttribute('srcdoc'); };
$('reload').onclick = run;

$('tab').onclick = () => {
  const s = getSource();
  if(s.url === '' || s.html === ''){ alert('Pehle code, file ya URL do.'); return; }
  if(s.url){ window.open(s.url, '_blank'); return; }
  const url = URL.createObjectURL(new Blob([s.html], {type:'text/html'}));
  window.open(url, '_blank');
};
</script>
</body>
</html>
