<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APK Studio</title>
<style>
:root{--bg:#10181f;--card:#18242e;--ink:#e8f0f4;--mut:#8ba0ad;--acc:#34d399;--bd:#26384a;--red:#f87171}
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:10px 14px;font-weight:800;color:var(--acc);font-size:18px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;border-bottom:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:700}
.tab{display:none;flex:1;min-height:0;overflow:auto;padding:12px}.tab.on{display:flex;flex-direction:column}
textarea,input,select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px;margin-bottom:8px}
#code{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.45;resize:none;white-space:pre;tab-size:2}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button.b{background:var(--acc);color:#06281c;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
button.g{background:var(--card);color:var(--ink);border:1px solid var(--bd)}
iframe{flex:1;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff;min-height:300px}
label{font-size:13px;color:var(--mut);margin-bottom:3px;display:block}
#log{background:#0b1117;border:1px solid var(--bd);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;min-height:120px;flex:1;overflow:auto}
.ok{color:var(--acc)}.er{color:var(--red)}a{color:var(--acc)}
</style></head><body>
<header>APK Studio <span style="font-size:12px;color:var(--mut)">HTML → APK</span></header>
<nav id="nv"></nav>

<section class="tab on" id="t-code">
<div class="bar"><button class="b" onclick="go('prev');run()">▶ Run</button>
<button class="b g" onclick="document.getElementById('file').click()">📂 Open file</button>
<button class="b g" onclick="dl()">⬇ Save</button>
<button class="b g" onclick="sample()">Sample</button></div>
<input type="file" id="file" accept=".html,.htm,.txt" hidden onchange="openF(this)">
<textarea id="code" spellcheck="false" autocapitalize="off" oninput="persist()"></textarea>
</section>

<section class="tab" id="t-prev"><div class="bar"><button class="b" onclick="run()">↻ Reload</button></div><iframe id="fr" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe></section>

<section class="tab" id="t-apk">
<label>GitHub username</label><input id="gu" value="drajbhar16132">
<label>Repo name</label><input id="gr" value="apk-builder">
<label>GitHub token (sirf is phone mein save hota hai)</label><input id="gt" type="password" placeholder="github_pat_...">
<label>App ka naam</label><input id="an" value="My App">
<label>Package ID</label><input id="ai" value="com.myapp.app">
<div class="bar"><button class="b" id="bb" onclick="build()">🚀 APK banao</button></div>
<div id="log">Taiyar. Token ko "Contents: Read/Write" aur "Actions: Read/Write" permission chahiye.</div>
</section>

<script>
const $=i=>document.getElementById(i);
const SAMPLE=`<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello</title>
<style>body{font-family:sans-serif;text-align:center;padding:40px;background:#eef}button{padding:14px 24px;font-size:18px;border:0;border-radius:12px;background:#4f46e5;color:#fff}</style></head>
<body><h1>Namaste 👋</h1><p>Count: <b id="c">0</b></p><button onclick="c.textContent=+c.textContent+1">Tap</button></body></html>`;
const tabs=[['code','Code'],['prev','Preview'],['apk','APK']];
$('nv').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
function go(id){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id=='t-'+id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==id));if(id=='prev')run()}
function run(){$('fr').srcdoc=$('code').value}
function sample(){$('code').value=SAMPLE;persist()}
function openF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('code').value=r.result;persist()};r.readAsText(f);i.value=''}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('code').value],{type:'text/html'}));a.download='index.html';a.click()}
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
function persist(){LS('code',$('code').value)}
$('code').value=LS('code')||SAMPLE;
['gu','gr','gt','an','ai'].forEach(k=>{const v=LS('f_'+k);if(v)$(k).value=v;$(k).addEventListener('input',()=>LS('f_'+k,$(k).value))});
$('code').addEventListener('keydown',e=>{if(e.key=='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText('  ',s,t.selectionEnd,'end')}});

const log=(m,c)=>{const d=document.createElement('div');if(c)d.className=c;d.innerHTML=m;$('log').appendChild(d);$('log').scrollTop=1e9};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const b64=s=>btoa(unescape(encodeURIComponent(s)));
let H,API;
async function gh(path,opt={}){const r=await fetch(API+path,{...opt,headers:{Authorization:'Bearer '+H,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});return r}
async function put(path,content,msg){let sha;const g=await gh('/contents/'+path);if(g.ok)sha=(await g.json()).sha;
const r=await gh('/contents/'+path,{method:'PUT',body:JSON.stringify({message:msg,content:b64(content),sha})});if(!r.ok)throw new Error(path+' upload fail: '+r.status+' '+(await r.text()).slice(0,150))}
function wf(name,id){const n=name.replace(/[^\w ]/g,'').trim()||'App',i=id.replace(/[^a-z0-9.]/gi,'').toLowerCase()||'com.myapp.app';
return['name: Build APK','on: workflow_dispatch','jobs:','  build:','    runs-on: ubuntu-latest','    steps:','      - uses: actions/checkout@v4','      - uses: actions/setup-node@v4','        with: { node-version: 22 }','      - uses: actions/setup-java@v4','        with: { distribution: temurin, java-version: 21 }','      - name: Capacitor','        run: |','          npm init -y','          npm i @capacitor/core @capacitor/cli @capacitor/android','          npx cap init "'+n+'" '+i+' --web-dir=www','          npx cap add android','          npx cap sync android','      - name: Build','        run: cd android && chmod +x gradlew && ./gradlew assembleDebug','      - uses: actions/upload-artifact@v4','        with:','          name: app-apk','          path: android/app/build/outputs/apk/debug/app-debug.apk',''].join('\n')}
async function build(){
const u=$('gu').value.trim(),r=$('gr').value.trim();H=$('gt').value.trim();API='https://api.github.com/repos/'+u+'/'+r;
if(!u||!r||!H){alert('Username, repo aur token bharo');return}
$('log').innerHTML='';$('bb').disabled=true;
try{
const ri=await gh('');if(!ri.ok)throw new Error('Repo nahi mila / token galat ('+ri.status+')');
const br=(await ri.json()).default_branch;
log('Code upload ho raha hai...');
await put('www/index.html',$('code').value,'Update app code');
await put('.github/workflows/build.yml',wf($('an').value,$('ai').value),'Update build workflow');
log('Build shuru kar rahe hain...');
const t0=Date.now()-60000;let ok=false;
for(let i=0;i<6&&!ok;i++){await sleep(3000);const d=await gh('/actions/workflows/build.yml/dispatches',{method:'POST',body:JSON.stringify({ref:br})});ok=d.status==204;if(!ok&&i==5)throw new Error('Dispatch fail '+d.status+' '+(await d.text()).slice(0,150))}
let run=null;
for(let i=0;i<20&&!run;i++){await sleep(4000);const l=await(await gh('/actions/workflows/build.yml/runs?event=workflow_dispatch&per_page=3')).json();run=(l.workflow_runs||[]).find(x=>new Date(x.created_at).getTime()>t0)}
if(!run)throw new Error('Run nahi mila. Actions tab check karo.');
log('Build chal raha hai (3-6 minute)... <a target="_blank" href="'+run.html_url+'">Live dekho</a>');
let st;
for(let i=0;i<120;i++){await sleep(8000);st=await(await gh('/actions/runs/'+run.id)).json();if(st.status=='completed')break;if(i%4==3)log('Abhi bhi chal raha: '+st.status)}
if(st.conclusion!='success'){let w='';try{const j=await(await gh('/actions/runs/'+run.id+'/jobs')).json();const f=(j.jobs[0].steps||[]).find(x=>x.conclusion=='failure');if(f)w=' Fail step: '+f.name+'.'}catch(e){}throw new Error('Build fail.'+w+' Logs: <a target="_blank" href="'+run.html_url+'">kholo</a>')}
log('Build ho gaya! Download...','ok');
const arts=await(await gh('/actions/runs/'+run.id+'/artifacts')).json();
const a=(arts.artifacts||[])[0];if(!a)throw new Error('Artifact nahi mila');
const z=await gh('/actions/artifacts/'+a.id+'/zip');if(!z.ok)throw new Error('Download fail '+z.status);
const bl=await z.blob();const el=document.createElement('a');el.href=URL.createObjectURL(bl);el.download='app-apk.zip';el.click();
log('✅ app-apk.zip download hua. Isko extract karke app-debug.apk install karo.','ok');
}catch(e){log('❌ '+e.message,'er')}
$('bb').disabled=false}
</script></body></html>
