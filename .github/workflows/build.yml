name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Html to Apk" com.htmlapp.app --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 1/;s/versionName "1.0"/versionName "1.0"/' android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
